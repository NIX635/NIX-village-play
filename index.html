<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NIX VILLAGE</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#ffeef5;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#5a3d4c}
  form{background:#fff;padding:28px 24px;border-radius:20px;box-shadow:0 8px 24px #e8a8c055;
    width:min(320px,calc(100vw - 32px));box-sizing:border-box;text-align:center}
  h1{margin:0 0 6px;font-size:22px} p{margin:0 0 18px;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:12px;border:2px solid #f3c1d4;border-radius:12px;font-size:16px}
  button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#ff8fb8;color:#fff;font-size:16px;font-weight:700}
  #msg{margin-top:12px;font-size:14px;min-height:1em}
  #bar{margin-top:14px;height:8px;border-radius:99px;background:#fbe0ea;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#ff8fb8;border-radius:99px;transition:width .2s}
  #sub{margin-top:6px;font-size:12px;color:#a08090;min-height:1em}
</style></head><body>
<form id="f" action="javascript:void 0">
  <h1>🏡 NIX VILLAGE</h1>
  <p>초대받은 친구만 들어올 수 있어요</p>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
  <button id="go" type="submit">들어가기</button>
  <div id="msg"></div>
  <div id="bar"><i id="fill"></i></div>
  <div id="sub"></div>
</form>
<script>
// 게임 파일은 따로 받아요 (화면은 바로 뜨고, 받는 동안 비밀번호를 쳐 둘 수 있어요). 한 번 받으면 폰에 보관해 다음엔 바로 열려요.
var G="g-a7b6da54b713.bin",SIZE=8530599,ITER=1000000,CACHE='nv-play';
var msg=document.getElementById('msg'),fill=document.getElementById('fill'),sub=document.getElementById('sub');
function say(t,err){msg.style.color=err?'#d33':'#5a3d4c';msg.textContent=t;}
function mb(n){return (n/1048576).toFixed(1);}
function b64(u){var s='';for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function setBar(p){fill.style.width=Math.round(p*100)+'%';}
var gotBytes=0,ready=false;
function showDownload(){if(!ready)sub.textContent='게임 받는 중 '+Math.min(99,Math.floor(gotBytes/SIZE*100))+'% ('+mb(gotBytes)+' / '+mb(SIZE)+'MB) · 처음 한 번만 받아요';}
async function fromCache(){try{if(!window.caches)return null;var c=await caches.open(CACHE);var r=await c.match(G);if(!r)return null;var b=new Uint8Array(await r.arrayBuffer());return b.length===SIZE?b:null;}catch(e){return null;}}
async function toCache(buf){try{if(!window.caches)return;var c=await caches.open(CACHE);await c.put(G,new Response(buf,{headers:{'content-type':'application/octet-stream'}}));var ks=await c.keys();for(var i=0;i<ks.length;i++)if(ks[i].url.indexOf(G)<0)await c.delete(ks[i]);}catch(e){}}
async function download(){
  for(var attempt=0;;attempt++){
    try{
      var res=await fetch(G,{cache:attempt?'reload':'default'});
      if(!res.ok)throw new Error('http '+res.status);
      var out=new Uint8Array(SIZE),off=0;
      if(res.body&&res.body.getReader){var rd=res.body.getReader();for(;;){var x=await rd.read();if(x.done)break;var v=x.value;if(off+v.length>out.length){var bigger=new Uint8Array(off+v.length);bigger.set(out.subarray(0,off));out=bigger;}out.set(v,off);off+=v.length;gotBytes=off;setBar(off/SIZE);showDownload();}}
      else{out=new Uint8Array(await res.arrayBuffer());off=out.length;}
      if(off!==SIZE)throw new Error('size');
      return out;
    }catch(e){if(attempt>=3)throw e;sub.textContent='연결이 끊겨서 다시 받는 중…';await new Promise(function(r){setTimeout(r,1500*(attempt+1));});}
  }
}
var data=(async function(){var b=await fromCache();if(b){ready=true;setBar(1);return b;}showDownload();b=await download();ready=true;setBar(1);sub.textContent='';toCache(b);return b;})();
data.catch(function(){sub.textContent='';say('게임을 받지 못했어요. 와이파이를 확인하고 새로 고침해 주세요',true);});
// 비밀번호 → 열쇠 (100만 번 계산이라 폰에서 몇 초 걸려요. 한 번 만든 열쇠는 기억해 둬요)
async function keyFor(pw,salt){
  var c=crypto.subtle;
  var base=await c.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=new Uint8Array(await c.deriveBits({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,256));
  return bits;
}
async function openWith(raw,bin){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return await crypto.subtle.decrypt({name:'AES-GCM',iv:bin.subarray(16,28)},key,bin.subarray(28));
}
async function inflate(plain){
  var h=new Uint8Array(plain,0,2);
  if(h[0]===0x1f&&h[1]===0x8b){
    if(typeof DecompressionStream==='undefined'){say('이 브라우저가 너무 오래돼서 못 열어요. 폰을 최신으로 업데이트해 주세요.',true);throw new Error('old');}
    return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  return new TextDecoder().decode(plain);
}
// 복사·붙여넣기로 앞뒤 빈칸이 붙거나, 폰이 첫 글자를 대문자로 바꿔도 열리게 몇 가지로 시도
function tries(pw){var t=pw.replace(/[\s​ ]+/g,''),l=[pw,pw.trim(),t,t.toLowerCase()],o=[];for(var i=0;i<l.length;i++)if(l[i]&&o.indexOf(l[i])<0)o.push(l[i]);return o;}
var busy=false;
async function enter(pw,remember){
  if(busy)return;busy=true;
  try{
    if(!ready)say('다 받으면 바로 들어가요!');
    var bin=await data,salt=bin.subarray(0,16),saltB=b64(salt),plain=null;
    var saved=null;try{saved=JSON.parse(localStorage.getItem('nv_play_k')||'null');}catch(e){}
    if(!pw&&saved&&saved.s===saltB){try{say('여는 중이에요…');plain=await openWith(u8(saved.k),bin);}catch(e){plain=null;}}
    if(!plain){
      if(!pw){busy=false;say('');return;}
      say('비밀번호 확인 중이에요…');
      var l=tries(pw),err;
      for(var i=0;i<l.length&&!plain;i++){try{var raw=await keyFor(l[i],salt);plain=await openWith(raw,bin);pw=l[i];try{localStorage.setItem('nv_play_k',JSON.stringify({s:saltB,k:b64(raw)}));}catch(e){}}catch(x){err=x;}}
      if(!plain){busy=false;try{localStorage.removeItem('nv_play_k');if(!remember)localStorage.removeItem('nv_play_pw');}catch(e){}say('비밀번호가 달라요. 다시 해 볼까요?',true);return;}
      if(remember){try{localStorage.setItem('nv_play_pw',pw);}catch(e){}}
    }
    say('여는 중이에요…');
    var html=await inflate(plain);
    document.open();document.write(html);document.close();
  }catch(e){busy=false;if(e&&e.message!=='old'&&ready)say('문제가 생겼어요. 새로 고침해 주세요',true);}
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();enter(document.getElementById('pw').value,true);});
// 전에 들어온 적 있으면: 기억한 열쇠(같은 salt) → 없으면 기억한 비밀번호로 자동으로 열어요
(function(){var pw=null;try{pw=localStorage.getItem('nv_play_pw');}catch(e){}var k=null;try{k=localStorage.getItem('nv_play_k');}catch(e){}
  if(!pw&&!k)return;say('여는 중이에요…');
  data.then(async function(bin){var saltB=b64(bin.subarray(0,16)),s=null;try{s=JSON.parse(k||'null');}catch(e){}
    if(s&&s.s===saltB){await enter(null,false);if(!busy&&pw)await enter(pw,false);}else if(pw)await enter(pw,false);else say('');
  }).catch(function(){});
})();
</script></body></html>
