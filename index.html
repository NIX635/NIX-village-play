<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NIX VILLAGE</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#ffeef5;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#5a3d4c}
  form{background:#fff;padding:28px 24px;border-radius:20px;box-shadow:0 8px 24px #e8a8c055;
    width:min(320px,calc(100vw - 32px));box-sizing:border-box;text-align:center}
  h1{margin:0 0 6px;font-size:22px} p{margin:0 0 18px;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:12px;border:2px solid #f3c1d4;border-radius:12px;font-size:16px}
  button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#ff8fb8;color:#fff;font-size:16px;font-weight:700}
  #msg{margin-top:12px;font-size:14px;min-height:1em}
  #bar{margin-top:14px;height:8px;border-radius:99px;background:#fbe0ea;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#ff8fb8;border-radius:99px;transition:width .2s}
  #sub{margin-top:6px;font-size:12px;color:#a08090;min-height:1em}
</style></head><body>
<form id="f" action="javascript:void 0">
  <h1>🏡 NIX VILLAGE</h1>
  <p>초대받은 친구만 들어올 수 있어요</p>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
  <button id="go" type="submit">들어가기</button>
  <div id="msg"></div>
  <div id="bar"><i id="fill"></i></div>
  <div id="sub"></div>
  <button id="again" type="button" style="display:none">이어서 받기</button>
</form>
<script>
// 게임 파일은 따로 받아요 (화면은 바로 뜨고, 받는 동안 비밀번호를 쳐 둘 수 있어요). 한 번 받으면 폰에 보관해 다음엔 바로 열려요.
// 게임 = 코드(g-*.bin, 업데이트마다 바뀜) + 그림 묶음(a-*.bin, 내용이 같으면 이름도 같음). 업데이트 뒤엔 바뀐 파일만 다시 받아요.
// 예전엔 그림까지 한 파일이라 업데이트마다 8MB 를 통째로 다시 받았어요 (NIX 2026-11-17 "로그인할 때마다 다운로드").
var G="g-033c09cba05f.bin",SIZE=3421885,ITER=1000000,ART=[["a-art-0-06ea2d39f4c0.bin",826039],["a-art-1-8fd328e6e9dd.bin",494171],["a-art-2-ce18a3f92192.bin",274080],["a-art-3-63d6326831fe.bin",613033],["a-art-4-08370c2a95b1.bin",1921011],["a-art-5-c501974bd015.bin",1174316],["a-art-6-a8fa8094b82e.bin",492395],["a-art-7-c357dae95c2d.bin",503612]],CACHE='nv-play';
var FILES=[{n:G,size:SIZE}].concat(ART.map(function(a){return {n:a[0],size:a[1]};}));
var msg=document.getElementById('msg'),fill=document.getElementById('fill'),sub=document.getElementById('sub');
function say(t,err){msg.style.color=err?'#d33':'#5a3d4c';msg.textContent=t;}
function mb(n){return (n/1048576).toFixed(1);}
function b64(u){var s='';for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function setBar(p){fill.style.width=Math.round(p*100)+'%';}
var gotBytes=0,needBytes=0,firstTime=true,ready=false;
function showDownload(){if(!ready&&needBytes)sub.textContent=(firstTime?'게임 받는 중 ':'업데이트 받는 중 ')+Math.min(99,Math.floor(gotBytes/needBytes*100))+'% ('+mb(gotBytes)+' / '+mb(needBytes)+'MB) · '+(firstTime?'처음 한 번만 받아요':'바뀐 것만 받아요');}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function openCache(n){try{return window.caches?await caches.open(n):null;}catch(e){return null;}}
async function fromCache(c,f){try{var r=c&&await c.match(f.n);if(!r)return null;var b=new Uint8Array(await r.arrayBuffer());return b.length===f.size?b:null;}catch(e){return null;}}
// 폰 보관함에 다 넣은 뒤에 들어가요. 넣는 도중에 게임 화면으로 바뀌면 보관이 끊겨서 다음 로그인 때 또 받았어요.
async function toCache(c,f,buf){try{if(c)await Promise.race([c.put(f.n,new Response(buf.slice(0),{headers:{'content-type':'application/octet-stream'}})),sleep(8000)]);}catch(e){}}
function keepName(u){var n=u.split('?')[0].split('/').pop();for(var i=0;i<FILES.length;i++)if(FILES[i].n===n)return true;return false;}
async function tidy(c,pc){try{if(c){var ks=await c.keys();for(var i=0;i<ks.length;i++)if(!keepName(ks[i].url))await c.delete(ks[i]);}if(pc){ks=await pc.keys();for(i=0;i<ks.length;i++)if(!keepName(ks[i].url))await pc.delete(ks[i]);}}catch(e){}}
// 데이터(LTE)에서 받다 끊겨도 처음부터 다시 받지 않게: 1MB 씩 나눠 받고, 받은 조각은 폰에 보관해요.
// 끊기면 받은 데까지 두고 천천히 다시(1·2·4·8·15·30초), 새로 고침해도 이어서 받아요 (NIX 2026-11-16 데이터에서 "게임을 받지 못했어요")
var CH=1048576,PART='nv-play-part';
function online(){return new Promise(function(r){if(navigator.onLine!==false&&!document.hidden)return r();function go(){if(navigator.onLine!==false&&!document.hidden){window.removeEventListener('online',go);document.removeEventListener('visibilitychange',go);r();}}window.addEventListener('online',go);document.addEventListener('visibilitychange',go);});}
async function loadParts(pc,f,have){var n=0;if(!pc)return 0;try{var ks=await pc.keys();for(var i=0;i<ks.length;i++){var u=ks[i].url,m=u.match(/[?&]p=(\d+)$/);if(u.split('?')[0].split('/').pop()!==f.n||!m)continue;var j=+m[1],r=await pc.match(ks[i]),b=new Uint8Array(await r.arrayBuffer());if(b.length===Math.min(CH,f.size-j*CH)){have[j]=b;n+=b.length;}}}catch(e){}return n;}
async function getChunk(f,j,pc,have){
  var a=j*CH,z=Math.min(f.size,a+CH)-1,res=await fetch(f.n,{headers:{Range:'bytes='+a+'-'+z},cache:'no-store'});
  if(res.status===200)return 'full';
  if(res.status!==206)throw new Error('http '+res.status);
  var want=z-a+1,out=new Uint8Array(want),off=0,base=gotBytes;
  if(res.body&&res.body.getReader){var rd=res.body.getReader();for(;;){var x=await rd.read();if(x.done)break;var v=x.value;if(off+v.length>want)throw new Error('size');out.set(v,off);off+=v.length;gotBytes=base+off;setBar(gotBytes/needBytes);showDownload();}}
  else{out=new Uint8Array(await res.arrayBuffer());off=out.length;}
  if(off!==want){gotBytes=base;throw new Error('short');}
  have[j]=out;gotBytes=base+want;
  try{if(pc)await pc.put(f.n+'?p='+j,new Response(out.slice(0)));}catch(e){}
}
async function getFull(f){
  var res=await fetch(f.n,{cache:'reload'});if(!res.ok)throw new Error('http '+res.status);
  var out=new Uint8Array(await res.arrayBuffer());if(out.length!==f.size)throw new Error('size');return out;
}
async function download(f,pc){
  var have=[],start=gotBytes,nch=Math.ceil(f.size/CH);gotBytes+=await loadParts(pc,f,have);setBar(gotBytes/needBytes);showDownload();
  var waits=[1000,2000,4000,8000,15000,30000],fails=0;
  for(var j=0;j<nch;j++){
    if(have[j])continue;
    for(;;){
      try{await online();var r=await getChunk(f,j,pc,have);if(r==='full'){gotBytes=start;var o=await getFull(f);gotBytes=start+f.size;return o;}fails=0;break;}
      catch(e){fails++;if(fails>waits.length)throw e;sub.textContent='연결이 끊겨서 받은 데부터 이어 받는 중… ('+mb(gotBytes)+' / '+mb(needBytes)+'MB)';await sleep(waits[fails-1]);}
    }
  }
  var out=new Uint8Array(f.size);for(var k=0;k<nch;k++)out.set(have[k],k*CH);
  return out;
}
// 다 모이면 [코드, 그림 묶음…] 순서로 넘겨요
var got=[];
var data=new Promise(function(done){
  async function run(){
    try{
      var c=await openCache(CACHE),pc=await openCache(PART),miss=[];
      for(var i=0;i<FILES.length;i++){if(!got[i])got[i]=await fromCache(c,FILES[i]);if(!got[i])miss.push(i);}
      // 예전 방식(한 파일) 보관함이 남아 있거나 아무것도 없으면 처음 받기, 일부만 없으면 업데이트 받기
      firstTime=miss.length===FILES.length;needBytes=0;gotBytes=0;for(i=0;i<miss.length;i++)needBytes+=FILES[miss[i]].size;
      if(miss.length){showDownload();for(i=0;i<miss.length;i++){var f=FILES[miss[i]];got[miss[i]]=await download(f,pc);await toCache(c,f,got[miss[i]]);}}
      ready=true;setBar(1);sub.textContent='';
      tidy(c,pc);
      done(got);
    }
    catch(e){
      sub.textContent='';say('인터넷이 약해서 잠깐 멈췄어요. 받은 데까지는 보관했어요',true);
      var bt=document.getElementById('again');bt.style.display='block';
      bt.onclick=function(){bt.style.display='none';say(busy?'다 받으면 바로 들어가요!':'');run();};
    }
  }
  run();
});
// 비밀번호 → 열쇠 (100만 번 계산이라 폰에서 몇 초 걸려요. 한 번 만든 열쇠는 기억해 둬요)
async function keyFor(pw,salt){
  var c=crypto.subtle;
  var base=await c.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=new Uint8Array(await c.deriveBits({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,256));
  return bits;
}
async function openWith(raw,bin){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return await crypto.subtle.decrypt({name:'AES-GCM',iv:bin.subarray(16,28)},key,bin.subarray(28));
}
// 그림 묶음을 풀어 게임 코드 안 자리(/*__NV_ART__*/)에 넣어요. 그림 묶음이 없는 예전 게임 파일은 그대로.
async function withArt(html,raw,bins){
  if(bins.length<2||html.indexOf('/*__NV_ART__*/')<0)return html;
  var t=[];for(var i=1;i<bins.length;i++)t.push('__nvA('+await inflate(await openWith(raw,bins[i]))+');');
  return html.replace('/*__NV_ART__*/',function(){return t.join('\n');});
}
async function inflate(plain){
  var h=new Uint8Array(plain,0,2);
  if(h[0]===0x1f&&h[1]===0x8b){
    if(typeof DecompressionStream==='undefined'){say('이 브라우저가 너무 오래돼서 못 열어요. 폰을 최신으로 업데이트해 주세요.',true);throw new Error('old');}
    return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  return new TextDecoder().decode(plain);
}
// 복사·붙여넣기로 앞뒤 빈칸이 붙거나, 폰이 첫 글자를 대문자로 바꿔도 열리게 몇 가지로 시도
function tries(pw){var t=pw.replace(/[\s​ ]+/g,''),l=[pw,pw.trim(),t,t.toLowerCase()],o=[];for(var i=0;i<l.length;i++)if(l[i]&&o.indexOf(l[i])<0)o.push(l[i]);return o;}
var busy=false;
async function enter(pw,remember){
  if(busy)return;busy=true;
  try{
    if(!ready)say('다 받으면 바로 들어가요!');
    var bins=await data,bin=bins[0],salt=bin.subarray(0,16),saltB=b64(salt),plain=null,rawK=null;
    var saved=null;try{saved=JSON.parse(localStorage.getItem('nv_play_k')||'null');}catch(e){}
    if(!pw&&saved&&saved.s===saltB){try{say('여는 중이에요…');rawK=u8(saved.k);plain=await openWith(rawK,bin);}catch(e){plain=null;}}
    if(!plain){
      if(!pw){busy=false;say('');return;}
      say('비밀번호 확인 중이에요…');
      var l=tries(pw),err;
      for(var i=0;i<l.length&&!plain;i++){try{var raw=await keyFor(l[i],salt);plain=await openWith(raw,bin);rawK=raw;pw=l[i];try{localStorage.setItem('nv_play_k',JSON.stringify({s:saltB,k:b64(raw)}));}catch(e){}}catch(x){err=x;}}
      if(!plain){busy=false;try{localStorage.removeItem('nv_play_k');if(!remember)localStorage.removeItem('nv_play_pw');}catch(e){}say('비밀번호가 달라요. 다시 해 볼까요?',true);return;}
      if(remember){try{localStorage.setItem('nv_play_pw',pw);}catch(e){}}
    }
    say('여는 중이에요…');
    var html=await withArt(await inflate(plain),rawK,bins);
    document.open();document.write(html);document.close();
  }catch(e){busy=false;if(e&&e.message!=='old'&&ready)say('문제가 생겼어요. 새로 고침해 주세요',true);}
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();enter(document.getElementById('pw').value,true);});
// 전에 들어온 적 있으면: 기억한 열쇠(같은 salt) → 없으면 기억한 비밀번호로 자동으로 열어요
(function(){var pw=null;try{pw=localStorage.getItem('nv_play_pw');}catch(e){}var k=null;try{k=localStorage.getItem('nv_play_k');}catch(e){}
  if(!pw&&!k)return;say('여는 중이에요…');
  data.then(async function(bins){var saltB=b64(bins[0].subarray(0,16)),s=null;try{s=JSON.parse(k||'null');}catch(e){}
    if(s&&s.s===saltB){await enter(null,false);if(!busy&&pw)await enter(pw,false);}else if(pw)await enter(pw,false);else say('');
  }).catch(function(){});
})();
</script></body></html>
