<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NIX VILLAGE 기록 백업</title>
<style>
  :root { --bg: #fff8f0; --card: #ffffff; --ink: #4a3b2f; --soft: #8a7a6c; --pink: #f58aa7; --ok: #3aa76d; --bad: #d9534f; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--soft); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
  label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #f0dccc; border-radius: 12px; font-size: 16px; }
  button { margin-top: 14px; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--pink); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { padding: 8px 0; border-top: 1px solid #f3e7dc; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; } .wait { color: var(--soft); }
  #msg { margin-top: 14px; font-size: 14px; white-space: pre-line; }
</style>
</head>
<body>
<main>
  <h1>💾 마을 기록 백업</h1>
  <p class="sub">두 창고(우리 전용 창고 + 공용 창고 3곳)에 있는 기록을 파일 하나로 내려받아요. 읽기만 하고 아무것도 바꾸지 않아요. 파일 안 내용은 잠긴 그대로예요.</p>
  <div class="card">
    <label for="pw">놀이 주소 비밀번호</label>
    <input id="pw" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" />
    <button id="go">백업 시작</button>
    <ul id="list"></ul>
    <div id="msg"></div>
  </div>
</main>
<script>
// 기록 백업 (읽기 전용). 각 창고에 우리 마을 주제 전체(…/#)를 구독해서 보관 소식(retain)만 모아 JSON 파일로 저장해요.
// 아무것도 올리거나 지우지 않아요 (CONNECT·SUBSCRIBE·PING 만 보냄).
let SERVERS = [
  { name: '우리 전용 창고 (Cloudflare)', url: 'wss://nix-relay.kmf251016.workers.dev/mqtt' },
  { name: '공용 창고 1 (EMQX)', url: 'wss://broker.emqx.io:8084/mqtt' },
  { name: '공용 창고 2 (HiveMQ)', url: 'wss://broker.hivemq.com:8884/mqtt' },
  { name: '공용 창고 3 (shiftr)', url: 'wss://public.cloud.shiftr.io', user: 'public', pass: 'public' },
];
// 시험용: ?servers=ws://…,ws://… (첫 번째가 전용 창고)
const _q = new URLSearchParams(location.search).get('servers');
if (_q) SERVERS = _q.split(',').map((url, i) => ({ name: i ? '공용 창고 ' + i : '우리 전용 창고', url }));
const enc = new TextEncoder();
const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
const sha = async (s) => hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };

function varint(n) { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; }
function str(s) { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
function packet(type, body) { return new Uint8Array([type, ...varint(body.length), ...body]); }
function connectPkt(id, user, pass) {
  let flags = 2; const tail = [...str(id)];
  if (user) { flags |= 0x80; tail.push(...str(user)); }
  if (pass) { flags |= 0x40; tail.push(...str(pass)); }
  return packet(0x10, [...str('MQTT'), 4, flags, 0, 30, ...tail]);
}
const subscribePkt = (topic) => packet(0x82, [0, 1, ...str(topic), 0]);

// 받은 바이트에서 패킷을 하나씩 꺼내요
function reader() {
  let buf = new Uint8Array(0);
  return (chunk) => {
    const nb = new Uint8Array(buf.length + chunk.length); nb.set(buf); nb.set(chunk, buf.length); buf = nb;
    const out = [];
    for (;;) {
      if (buf.length < 2) break;
      let len = 0, mul = 1, i = 1, done = false;
      while (i < buf.length && i < 5) { const d = buf[i++]; len += (d & 127) * mul; mul *= 128; if (!(d & 128)) { done = true; break; } }
      if (!done || buf.length < i + len) break;
      out.push({ h: buf[0], body: buf.subarray(i, i + len) });
      buf = buf.subarray(i + len);
    }
    return out;
  };
}

function collect(server, filter, row) {
  return new Promise((resolve) => {
    const got = {}; let lastAt = Date.now(); let subbed = false; let finished = false;
    const finish = (status) => { if (finished) return; finished = true; try { ws.close(); } catch {} clearInterval(tick); resolve({ status, retained: got }); };
    let ws;
    try { ws = new WebSocket(server.url, ['mqtt']); } catch { return resolve({ status: 'fail', retained: got }); }
    ws.binaryType = 'arraybuffer';
    const read = reader();
    ws.onopen = () => ws.send(connectPkt('nvbk-' + Math.random().toString(16).slice(2, 10), server.user, server.pass));
    ws.onmessage = (e) => {
      for (const p of read(new Uint8Array(e.data))) {
        const type = p.h >> 4;
        if (type === 2) { if (p.body[1] !== 0) return finish('fail'); ws.send(subscribePkt(filter)); }
        else if (type === 9) { subbed = true; lastAt = Date.now(); }
        else if (type === 3) {
          const retain = p.h & 1; const qos = (p.h >> 1) & 3;
          const tl = (p.body[0] << 8) | p.body[1];
          const topic = new TextDecoder().decode(p.body.subarray(2, 2 + tl));
          const payload = p.body.subarray(2 + tl + (qos ? 2 : 0));
          lastAt = Date.now();
          if (retain && payload.length) got[topic] = b64(payload);
          row.textContent = Object.keys(got).length + '개 받는 중…';
        }
      }
    };
    ws.onerror = () => {};
    ws.onclose = () => finish(subbed ? 'ok' : 'fail');
    const started = Date.now();
    // 구독 뒤 4초 동안 새 기록이 없으면 끝 (최대 40초)
    const tick = setInterval(() => {
      const now = Date.now();
      if (subbed && now - lastAt > 4000) finish('ok');
      else if (now - started > 40000) finish(subbed ? 'ok' : 'fail');
    }, 500);
  });
}

document.getElementById('go').onclick = async () => {
  const pw = document.getElementById('pw').value.replace(/\s/g, '');
  const btn = document.getElementById('go'); const list = document.getElementById('list'); const msg = document.getElementById('msg');
  if (!pw) return (msg.textContent = '비밀번호를 넣어 주세요');
  btn.disabled = true; msg.textContent = ''; list.innerHTML = '';
  const room = 'nv-' + (await sha('nix-village-play-room:' + pw)).slice(0, 24);
  const base = 'nixv1/' + (await sha('topic:' + room)).slice(0, 24);
  const rows = SERVERS.map((s) => { const li = document.createElement('li'); li.innerHTML = `<span>${s.name}</span><span class="wait">연결 중…</span>`; list.appendChild(li); return li.lastChild; });
  const results = await Promise.all(SERVERS.map((s, i) => collect(s, base + '/#', rows[i])));
  const out = { app: 'nix-village-backup', v: 1, at: new Date().toISOString(), base, servers: {} };
  let total = 0;
  results.forEach((r, i) => {
    const n = Object.keys(r.retained).length; total += n;
    out.servers[SERVERS[i].url] = { name: SERVERS[i].name, status: r.status, count: n, retained: r.retained };
    rows[i].className = r.status === 'ok' ? 'ok' : 'bad';
    rows[i].textContent = r.status === 'ok' ? `✓ ${n}개` : `✕ 연결 안 됨 (${n}개)`;
  });
  if (!total) { btn.disabled = false; return (msg.textContent = '기록을 하나도 못 받았어요. 비밀번호가 맞는지 확인해 주세요.'); }
  // 창고마다 몇 개가 다른지 (공용에만 있는 것 = 옛 기록)
  const relay = out.servers[SERVERS[0].url].retained; const pub = new Set();
  for (const s of SERVERS.slice(1)) for (const t of Object.keys(out.servers[s.url].retained)) pub.add(t);
  const onlyPub = [...pub].filter((t) => !(t in relay)).length; const onlyRelay = Object.keys(relay).filter((t) => !pub.has(t)).length;
  out.summary = { publicTopics: pub.size, relayTopics: Object.keys(relay).length, onlyPublic: onlyPub, onlyRelay };
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `nix-village-backup-${out.at.slice(0, 16).replace(/[:T]/g, '-')}.json`; a.click();
  msg.textContent = `파일을 내려받았어요 (${(blob.size / 1e6).toFixed(1)}MB).\n공용 창고 기록 ${pub.size}개 · 전용 창고 기록 ${Object.keys(relay).length}개\n공용 창고에만 있는 옛 기록 ${onlyPub}개`;
  btn.disabled = false;
};
</script>
</body>
</html>
